
services:
  - type: worker
    name: 855goal-telegram-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATA_DIR
        value: /var/data
    disk:
      name: 855goal-bot-data
      mountPath: /var/data
      sizeGB: 1
